# ============================================================================
# ARGUS — Docker Compose foundation
#
# Phase 01 only establishes the base services. Postgres/ChromaDB/Redis are
# intentionally NOT enabled yet; they are listed below as commented-out
# reservations for Phase 02+ so the run surface stays minimal today.
# ============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argus-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ARGUS_ENV: ${ARGUS_ENV:-development}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend is intentionally not containerized in Phase 01; it runs via
  # `npm run dev` on the host during development.

